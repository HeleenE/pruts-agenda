    url: https://debalie.nl/programma/the-politics-of-the-internet-14-10-2026/
    description: Britt Paris examines the architecture of power embedded in the internet and asks how digital infrastructure could be organized around public values rather than private interests, with an artistic intermezzo by Jen Liu.
    source: Critical Infrastructure Lab
    categories:
      - digital infrastructure
