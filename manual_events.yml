# Manual events are merged into the generated iCalendar feed.
# For all-day multi-day events, end is exclusive: use the day after the final day.
events:
  - id: hackfest.nl-2026
    title: HackFest 2026
    start: 2026-10-10
    end: 2026-10-11
    all_day: true
    location: Enschede, Netherlands
    url: https://hackfest.nl/
    description: |
      HackFest aims to make technology and knowledge accessible to
      everyone, promotes creativity and stimulates both social and
      economic innovation. On Saturday 10 Oktober 2026, Hackfest gives
      a platform to a diverse group of creative minds, hackers,
      inventors, designers, artists, engineers, developers and
      hobbyists to showcase their projects in an inspiring space.

      These enthusiastic makers come to Hackfest to present their
      creations and share their discoveries with the public. The event
      brings together curious people who enjoy learning and sharing
      their skills through lectures and workshops and working on their
      own projects on site. It is a place where people are amazed by
      installations, original do-it-yourself projects, fascinating
      discoveries and innovative solutions.

      Hackfest puts these projects in the spotlight and provides a
      platform for original ideas.
    categories:
      - exposition
      - maker

