name: Sync calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: write

concurrency:
  group: sync-calendar
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile *.py

      - name: Check required secrets
        env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          GOOGLE_TOKEN_B64: ${{ secrets.GOOGLE_TOKEN_B64 }}
        run: |
          test -n "$GOOGLE_CREDENTIALS_B64" || {
            echo "Missing repository secret: GOOGLE_CREDENTIALS_B64"
            exit 1
          }
          test -n "$GOOGLE_TOKEN_B64" || {
            echo "Missing repository secret: GOOGLE_TOKEN_B64"
            exit 1
          }

      - name: Sync Google Calendar
        env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          GOOGLE_TOKEN_B64: ${{ secrets.GOOGLE_TOKEN_B64 }}
        run: python main.py --sync --no-report --delete-stale

      - name: Commit sync digest
        run: |
          if git diff --quiet -- SYNC_DIGEST.md; then
            echo "No sync digest changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SYNC_DIGEST.md
          git commit -m "Update sync digest"
          git push
